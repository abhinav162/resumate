name: Auto Deploy via Docker

on:
  push:
    branches:
      - chore/architecture-upgrade

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build and Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-backend:latest

      # Build and Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-frontend:latest

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy on Server
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${VM_USER}@${VM_IP} << EOF
          echo "🛠️ Pulling latest Resumate images..."
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
          
          cd $PROJECT_PATH
          
          # Ensure we have the latest code (for docker-compose.yml updates)
          git pull origin main
          
          # Export GHCR_USERNAME for docker-compose
          export GHCR_USERNAME=$GHCR_USERNAME
          
          echo "⬇️ Pulling images..."
          docker-compose pull

          echo "🔁 Restarting containers..."
          docker-compose up -d

          echo "🩺 Checking service health..."
          sleep 10
          if curl -f http://localhost:4300/health; then
              echo "✅ Backend is healthy!"
          else
              echo "⚠️ Backend health check failed (might just be slow startup)"
          fi
          EOF
