name: Auto Deploy via Docker

on:
  push:
    branches:
      - main
      - staging

# Staging vs prod is decided by branch; computed once here so the parallel
# jobs below stay in sync.
env:
  ENV_NAME: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}
  IMAGE_TAG: ${{ github.ref == 'refs/heads/staging' && 'latest-staging' || 'latest-prod' }}

jobs:
  # The deploy VM is arm64, so images are arm64-only — the old setup also
  # built a never-used amd64 image, and ran the arm64 npm build under QEMU
  # emulation, which dominated the ~11 min pipeline.
  #
  # Runner choice adapts to repo visibility: while the repo is PUBLIC, builds
  # run natively on GitHub's free ARM runners (fast). If the repo goes
  # PRIVATE, free ARM runners disappear, so the jobs automatically fall back
  # to x86 ubuntu-latest + QEMU emulation — slower, but nothing breaks and
  # the layer cache still absorbs most of the cost. No workflow edit needed.
  build-backend:
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation — private-repo fallback only)
        if: ${{ github.event.repository.private }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation — private-repo fallback only)
        if: ${{ github.event.repository.private }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend-v2/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy on Server
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          ENV_NAME: ${{ env.ENV_NAME }}
        run: |
          # 1. Copy files to server (docker-compose.yml and deploy.sh)
          echo "📂 Copying configuration files to server..."
          scp -o StrictHostKeyChecking=no -i private_key.pem docker-compose.yml deploy.sh ${VM_USER}@${VM_IP}:${PROJECT_PATH}/

          # 2. Execute deployment script via SSH
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${VM_USER}@${VM_IP} << EOF
          echo "🛠️ Pulling latest Resumate images for ${ENV_NAME}..."
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin

          cd $PROJECT_PATH

          # Make script executable
          chmod +x deploy.sh

          # Export GHCR_USERNAME for docker-compose
          export GHCR_USERNAME=$GHCR_USERNAME

          # Run the deploy script with the environment argument
          ./deploy.sh $ENV_NAME
          EOF
