name: Auto Deploy via Docker

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest-staging" >> $GITHUB_ENV
          else
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest-prod" >> $GITHUB_ENV
          fi

      # Build and Push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-backend:${{ env.IMAGE_TAG }}

      # Build and Push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend-v2/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/resumate-frontend:${{ env.IMAGE_TAG }}

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Deploy on Server
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_IP: ${{ secrets.VM_IP }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          ENV_NAME: ${{ env.ENV_NAME }}
        run: |
          # 1. Copy files to server (docker-compose.yml and deploy.sh)
          echo "📂 Copying configuration files to server..."
          scp -o StrictHostKeyChecking=no -i private_key.pem docker-compose.yml deploy.sh ${VM_USER}@${VM_IP}:${PROJECT_PATH}/

          # 2. Execute deployment script via SSH
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${VM_USER}@${VM_IP} << EOF
          echo "🛠️ Pulling latest Resumate images for ${ENV_NAME}..."
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
          
          cd $PROJECT_PATH
          
          # Make script executable
          chmod +x deploy.sh
          
          # Export GHCR_USERNAME for docker-compose
          export GHCR_USERNAME=$GHCR_USERNAME
          
          # Run the deploy script with the environment argument
          ./deploy.sh $ENV_NAME
          EOF
