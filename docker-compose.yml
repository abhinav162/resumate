services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "4300:4300"
    environment:
      - NODE_ENV=production
      - PORT=4300
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3160:80"
    restart: always
    depends_on:
      - backend
